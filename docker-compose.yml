version: "3.9"

services:
  userservice-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: userservice
      MYSQL_DATABASE: user_service
      MYSQL_USER: userservice
      MYSQL_PASSWORD: userservicepassword
    ports:
      - "3306:3306"
    volumes:
      - userservice-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
      timeout: 5s
    networks:
      - net-user

  userservice:
    build:
      context: ./user-service
    depends_on:
      userservice-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://userservice-db:3306/user_service
      SPRING_DATASOURCE_USERNAME: userservice
      SPRING_DATASOURCE_PASSWORD: userservicepassword
    ports:
      - "8081:8080"
    networks:
      - net-user

volumes:
  userservice-db-data:

networks:
  net-user:
